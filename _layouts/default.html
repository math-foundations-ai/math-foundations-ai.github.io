<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    {% assign meta_title = page.browser_title | default: page.title %}
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#5babda" />
    <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace }}" />
    <meta property="og:title" content="{% if meta_title %}{{ meta_title }} · {% endif %}{{ site.title }}" />
    <meta property="og:description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace }}" />
    <meta property="og:type" content="{% if page.collection %}article{% else %}website{% endif %}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{% if meta_title %}{{ meta_title }} · {% endif %}{{ site.title }}" />
    <meta name="twitter:description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace }}" />
    {% unless page.collection %}
      <meta property="og:image" content="{{ site.og_image | absolute_url }}" />
      <meta name="twitter:image" content="{{ site.og_image | absolute_url }}" />
    {% endunless %}
    <title>{% if meta_title %}{{ meta_title }} · {% endif %}{{ site.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=DM+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet" />
    <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml" />
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}" />
  </head>
  <body class="page-{{ page.nav_key | default: 'default' }}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include header.html %}
    <main id="main-content">
      {{ content }}
    </main>
    {% include footer.html %}
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </body>
</html>
